name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests run against a real PostgreSQL. Nothing here is stubbed.
  TEST_DATABASE_URL: postgres://everecho:everecho@localhost:5432/everecho_test
  DATABASE_URL: postgres://everecho:everecho@localhost:5432/everecho_test

jobs:
  verify:
    name: Lint, types, tests and evaluations
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector so the optional vector migration is exercised in CI even
        # though the portable path is what most deployments will use.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: everecho
          POSTGRES_PASSWORD: everecho
          POSTGRES_DB: everecho_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U everecho -d everecho_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: AI evaluations
        # Fails the build if a release-blocking target is missed: citation
        # correctness, unsupported claims, abstention, or any permission leak.
        run: pnpm eval

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: warn

      - name: OpenAPI is up to date
        run: |
          pnpm openapi
          git diff --exit-code docs/openapi.json \
            || (echo "docs/openapi.json is stale — run 'pnpm openapi' and commit the result" && exit 1)

  browser:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: everecho
          POSTGRES_PASSWORD: everecho
          POSTGRES_DB: everecho
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U everecho -d everecho"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgres://everecho:everecho@localhost:5432/everecho
      NEXT_PUBLIC_API_URL: http://localhost:4000
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
      STORAGE_SIGNING_SECRET: ci-only-storage-signing-secret-not-used-elsewhere
      STORAGE_LOCAL_DIR: ./var/storage
      EMAIL_OUTBOX_DIR: ./var/outbox
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Migrate and seed the demonstration archive
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Build the web application
        run: pnpm --filter @everecho/web build

      - name: Start the API, worker and web application
        run: |
          pnpm --filter @everecho/api start > /tmp/api.log 2>&1 &
          pnpm --filter @everecho/worker start > /tmp/worker.log 2>&1 &
          pnpm --filter @everecho/web start > /tmp/web.log 2>&1 &
          npx wait-on http://localhost:4000/healthz http://localhost:3000 --timeout 90000

      - name: End-to-end and accessibility tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            /tmp/api.log
            /tmp/web.log
          if-no-files-found: warn

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Known vulnerabilities
        run: pnpm audit --audit-level high

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
